    <g font-family="ui-monospace, monospace" fill="#22d3ee" font-size="14">
      <text x="16" y="34">ESP32  --&gt; Mosquitto</text>
      <text x="16" y="56">FastAPI --&gt; Postgres</text>
      <text x="16" y="78">FastAPI --&gt; ChromaDB</text>
      <text x="16" y="100" fill="#34d399">React   --&gt;  live WS</text>
