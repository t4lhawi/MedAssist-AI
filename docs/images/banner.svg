<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="MedAssist AI banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#ffffff">
    <text x="60" y="110" font-size="48" font-weight="700">MedAssist AI</text>
    <text x="60" y="150" font-size="20" fill="#cbd5e1">Intelligent hospital surveillance · IoT · RAG · Real-time</text>
    <text x="60" y="200" font-size="14" fill="#94a3b8">CHU Mohammed VI d'Oujda · 2026</text>
  </g>
  <g transform="translate(900 60)">
