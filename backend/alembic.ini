# A generic, single-database Alembic configuration.

[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration file names. The default is the
# ``%%(rev)s_%%(slug)s`` slug-and-revision pattern.
file_template = %%(rev)s_%%(slug)s

# Timezone for ``alembic revision --date`` (UTC by default).
timezone = UTC

# Max identifier length in the slugs (default 40 — bump to allow longer
# descriptions).
truncate_slug_length = 40

# Set to `true` to allow `revision`/`stamp` to add the table without
# performing the migration.
revision_environment = false

# Revision file template (used when ``alembic revision`` is called).
# Placeholders: %(year)s, %(month)s, %(day)s, %(hour)s, %(minute)s, %(rev)s, %(slug)s

# sqlalchemy.url is read from the environment via env.py — leave blank here.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# (Optional) Format Python files with black after generation.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79

# (Optional) Run ruff after generation.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = --fix


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
