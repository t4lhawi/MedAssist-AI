server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes UI retombent sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend FastAPI (service "backend" sur le réseau Docker).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade — required so /api/realtime/ws reaches the
        # backend. Without these two headers, Nginx treats the connection
        # as plain HTTP and the WS handshake fails.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Évite la mise en cache de l'index pour le dev.
    location = /index.html { add_header Cache-Control "no-store"; }
}
