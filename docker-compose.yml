# ════════════════════════════════════════════════════════════
#  MedAssist AI – Docker Compose (dev + prod léger)
#  Usage :
#      cp .env.example .env
#      docker compose up --build -d
#      docker exec medassist_ollama ollama pull llama3.2
#      docker exec medassist_ollama ollama pull nomic-embed-text
#
#  UI    : http://localhost:3000
#  API   : http://localhost:8000/docs
#  Broker: localhost:1883 (mosquitto)
#  LLM   : Ollama local (gratuit, pas de clé API, pas de quota)
# ════════════════════════════════════════════════════════════

name: medassist

services:
  # ── Postgres ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medassist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medassist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"        # exposé pour debug local (psql, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medassist}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medassist_net

  # ── Ollama (LLM local) ──────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: medassist_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"      # pratique pour `ollama list` depuis l'hôte
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - medassist_net

  # ── Mosquitto (broker MQTT) ─────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: medassist_mosquitto
    restart: unless-stopped
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"        # ESP32 + outils CLI
    networks:
      - medassist_net

  # ── Backend FastAPI ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medassist_api
    restart: unless-stopped
    env_file: .env
    environment:
      # On s'assure que ces variables pointent vers les services Docker,
      # même si l'utilisateur a laissé localhost dans .env.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@postgres:5432/medassist}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      CHROMA_PATH: /data/chroma
      UPLOAD_DIR: /data/uploads
    volumes:
      - chroma_data:/data/chroma
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started   # on n'attend pas un modèle précis
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medassist_net

  # ── Frontend (Nginx servant le build Vite) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vide => le frontend parle à "/api/..." qui est proxifié par Nginx.
        VITE_API_URL: ""
    container_name: medassist_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - medassist_net

# ── Volumes nommés (persistent entre `docker compose down`) ─
volumes:
  pgdata:
  ollama_data:
  chroma_data:
  uploads_data:

# ── Réseau dédié ──────────────────────────────────────────
networks:
  medassist_net:
    driver: bridge
