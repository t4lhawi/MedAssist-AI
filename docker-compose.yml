services:
  # ── Postgres ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - medassist

  # ── Mosquitto (MQTT for IoT ingestion) ────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    # WARNING: no authentication = open to the whole internet.
    ports:
      - "1883:1883"
    volumes:
      - mqttdata:/mosquitto/data
    networks:
      - medassist

  # ── Backend (FastAPI) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHROMA_PATH: /data/chroma
      UPLOAD_DIR:  /data/uploads
      MQTT_HOST:   mosquitto
    volumes:
      - medassist-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - medassist

  # ── Frontend (nginx → SPA) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      medassist:
        aliases:
          - medassist-frontend

volumes:
  pgdata:
  mqttdata:
  medassist-data:

networks:
  medassist:
    driver: bridge
